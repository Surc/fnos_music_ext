name: Sync upstream

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: Reviewed Git bundle file on this transport branch
        required: true
        default: upstream-2.8.0-merge.bundle
      sha256:
        description: Expected bundle SHA256
        required: true
        default: 18065aebbfd43b125eb043962a69cfc08b2b46f3c45e0f8178fa5a49742b16ee
      commit:
        description: Exact reviewed candidate commit
        required: true
        default: d56b8da17b4241024f5efa42ecfe85ac6a6d6c7e
      branch:
        description: Integration or documentation branch (never main)
        required: true
        default: integration/upstream-v2.8.0-20261011

permissions:
  contents: write

concurrency:
  group: upstream-reviewed-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Verify and import the reviewed history
        env:
          BUNDLE_FILE: ${{ inputs.bundle }}
          BUNDLE_DIGEST: ${{ inputs.sha256 }}
          CANDIDATE_SHA: ${{ inputs.commit }}
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          [[ "$BUNDLE_FILE" =~ ^[A-Za-z0-9._-]+\.bundle$ ]]
          [[ "$BUNDLE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_BRANCH" =~ ^(integration|docs)/[A-Za-z0-9._/-]+$ ]]
          git check-ref-format "refs/heads/$TARGET_BRANCH"
          printf '%s  %s\n' "$BUNDLE_DIGEST" "$BUNDLE_FILE" | sha256sum -c -
          git bundle verify "$BUNDLE_FILE"
          git fetch --no-tags "./$BUNDLE_FILE" HEAD:refs/remotes/reviewed/candidate
          test "$(git rev-parse refs/remotes/reviewed/candidate)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor 264d5ace2d95ed515b9695245d28c23bf90e8f1f "$CANDIDATE_SHA"
          git merge-base --is-ancestor 6973402df5e180cd49a00af4db48758504303c58 "$CANDIDATE_SHA"
          git push origin "$CANDIDATE_SHA:refs/heads/$TARGET_BRANCH"
